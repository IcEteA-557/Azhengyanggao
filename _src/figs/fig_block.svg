<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="3-bit ALU block diagram">
<title>3-bit ALU block diagram</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
<rect x="270" y="66" width="220" height="174" rx="2" fill="#fafafa" stroke="#111111" stroke-width="1.1"/>
<text x="380" y="112" text-anchor="middle" font-family="Times New Roman, Songti SC, serif" font-size="15" fill="#111111" font-weight="bold">3-bit ALU</text>
<text x="380" y="132" text-anchor="middle" font-family="Times New Roman, Songti SC, serif" font-size="10" fill="#555555" font-style="italic">combinational logic</text>
<text x="380" y="162" text-anchor="middle" font-family="Times New Roman, Songti SC, serif" font-size="9.5" fill="#111111">one operation selected by op[1:0]</text>
<text x="380" y="186" text-anchor="middle" font-family="Times New Roman, Songti SC, serif" font-size="10" fill="#111111" font-weight="bold">ADD   AND   XOR   SHR</text>
<text x="40" y="88" text-anchor="start" font-family="Times New Roman, Songti SC, serif" font-size="11" fill="#111111">A[2:0]</text>
<line x1="96" y1="96" x2="266" y2="96" stroke="#111111" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="40" y="148" text-anchor="start" font-family="Times New Roman, Songti SC, serif" font-size="11" fill="#111111">B[2:0]</text>
<line x1="96" y1="156" x2="266" y2="156" stroke="#111111" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="40" y="208" text-anchor="start" font-family="Times New Roman, Songti SC, serif" font-size="11" fill="#111111">op[1:0]</text>
<line x1="96" y1="216" x2="266" y2="216" stroke="#111111" stroke-width="1.1" marker-end="url(#arrow)"/>
<line x1="494" y1="96" x2="560" y2="96" stroke="#111111" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="570" y="100" text-anchor="start" font-family="Times New Roman, Songti SC, serif" font-size="11" fill="#111111">result[2:0]</text>
<line x1="494" y1="146" x2="560" y2="146" stroke="#111111" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="570" y="150" text-anchor="start" font-family="Times New Roman, Songti SC, serif" font-size="11" fill="#111111">carry</text>
<line x1="494" y1="190" x2="560" y2="190" stroke="#111111" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="570" y="194" text-anchor="start" font-family="Times New Roman, Songti SC, serif" font-size="11" fill="#111111">dup_result[2:0]</text>
<line x1="494" y1="226" x2="560" y2="226" stroke="#111111" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="570" y="230" text-anchor="start" font-family="Times New Roman, Songti SC, serif" font-size="11" fill="#111111">dup_carry</text>
<text x="380" y="262" text-anchor="middle" font-family="Times New Roman, Songti SC, serif" font-size="9.5" fill="#555555" font-style="italic">dup_result and dup_carry repeat the same values on JA1–JA4</text>
<text x="380" y="280" text-anchor="middle" font-family="Times New Roman, Songti SC, serif" font-size="9.5" fill="#555555" font-style="italic">so the logic analyser can observe the LED outputs.</text>
</svg>
